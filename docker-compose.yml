version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: task-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskmanagement
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass123
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - task-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskmanagement"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:7
    container_name: task-management-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taskapi.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - task-network
    depends_on:
      - postgres

  # Main application service
  task-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-management-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=taskmanagement
      - DB_USER=taskuser
      - DB_PASSWORD=taskpass123
    volumes:
      # Persist logs outside the container
      - ./logs:/app/logs
      # Mount config files (if needed in the future)
      - ./config:/app/config:ro
    networks:
      - task-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.task-api.rule=Host(`localhost`)"
      - "traefik.http.services.task-api.loadbalancer.server.port=3000"

  # Development service with hot reloading
  task-api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: task-management-api-dev
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - LOG_LEVEL=debug
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    networks:
      - task-network
    profiles:
      - dev
    command: npm run dev

networks:
  task-network:
    driver: bridge
    labels:
      - "com.docker.compose.project=task-management"

volumes:
  postgres_data:
    driver: local
    labels:
      - "com.docker.compose.project=task-management"
  pgadmin_data:
    driver: local
    labels:
      - "com.docker.compose.project=task-management"
  logs:
    driver: local
    labels:
      - "com.docker.compose.project=task-management"